# Platform doğrulaması. Her işletim sistemi:
#   1. Çalışma zamanının (rt_deps ile birlikte) tip denetimini yapar,
#   2. masaüstü arka ucunun duman testini çalıştırır: pencere açılır, OpenGL çizer ve bir pikseli geri okur,
#      tampon değişir, girdi yoklanır, fare yakalama açılıp kapanır, ses aygıtına bir ton gönderilir.
#      Linux'ta pencere Xvfb (sanal ekran) üzerinde açılır; ses aygıtı yoksa betik sessiz çıkışa düşer ve bunu bildirir.
# Oyunun tamamı (çeviri, derleme, açılış) .github/workflows/game.yml içindedir.
name: platforms

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Vendored dependencies, offline build (rt_deps)
        run: |
          cd rt_deps
          cargo build --release --offline

      - name: Runtime type-check for this platform (tools/rt_typecheck.py)
        run: python tools/rt_typecheck.py

      - name: Audio mixer and device layer unit tests
        run: |
          rustc --edition 2021 --test tests/rust/audio_main.rs -o audio_tests
          ./audio_tests

      - name: Sanal ekran (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri

      - name: Desktop back end smoke test (build)
        run: |
          case "$RUNNER_OS" in Windows) X=.exe;; *) X=;; esac
          rustc --edition 2021 -O tests/rust/desktop_main.rs -o "desktop_smoke$X"

      - name: Desktop back end smoke test (window, OpenGL, input, audio)
        run: |
          case "$RUNNER_OS" in
            Linux) xvfb-run -a ./desktop_smoke ;;
            Windows) ./desktop_smoke.exe ;;
            macOS) ./desktop_smoke ;;
          esac

  translator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Lint (pyflakes)
        run: |
          python -m pip install pyflakes
          python -m pyflakes monolith tools tests
      - name: Release tooling self-check (packaging on a stub build)
        run: |
          mkdir -p /tmp/stub/rust /tmp/stub/resources
          printf '#!/bin/sh\necho stub\n' > /tmp/stub/rust/prog && chmod +x /tmp/stub/rust/prog
          printf '#!/bin/sh\n' > /tmp/stub/run.sh
          python tools/make_release.py /tmp/stub --out /tmp/dist --name Stub --version 0.0.0 --dry-run
