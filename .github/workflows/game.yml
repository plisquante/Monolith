# Oyunun her platformda derlenip açılması. İstemci jar'ı tools/fetch_client_jar.py ile Mojang'ın resmi manifest'inden
# indirilir ve SHA-1 ile doğrulanır; depoya ve artefaktlara konmaz. MC_CLIENT_JAR_URL gizli değişkeni tanımlıysa
# (ayna, yalnız https) o adres kullanılır; bu durumda MC_CLIENT_JAR_SHA1 gizli değişkeni de zorunludur (yoksa indirme reddedilir).
name: game

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MC_CLIENT_JAR_URL: ${{ secrets.MC_CLIENT_JAR_URL }}
  MC_CLIENT_JAR_SHA1: ${{ secrets.MC_CLIENT_JAR_SHA1 }}

jobs:
  boot-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Istemci jar'i (resmi manifest, SHA-1 dogrulamali)
        run: python3 tools/fetch_client_jar.py --version 26.3 --out "$RUNNER_TEMP/client.jar"

      - name: Sanal ekran ve OpenGL (Xvfb, Mesa, ImageMagick)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick

      - name: Oyunu derle (JDK ve kutuphaneler otomatik)
        run: |
          python3 tools/mcbuild_rust.py "$RUNNER_TEMP/client.jar" -o build/minecraft-26.3 --shards 32 --shard-jobs 1

      - name: Oyunu sanal ekranda ac ve dogrula (120 sn)
        run: sh tools/ci_game_boot.sh build/minecraft-26.3 --seconds 120 --out build/minecraft-26.3/boot

      - name: Eszamanli GC ile acilis (MONO_GC_CONCURRENT=1, 120 sn)
        run: MONO_GC_CONCURRENT=1 sh tools/ci_game_boot.sh build/minecraft-26.3 --seconds 120 --out build/minecraft-26.3/boot-concurrent --display :98

      - name: Ekran goruntusu ve gunluk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-boot-linux
          path: build/minecraft-26.3/boot
          if-no-files-found: warn
          retention-days: 14

  boot-windows:
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Istemci jar'i (resmi manifest, SHA-1 dogrulamali)
        run: python tools/fetch_client_jar.py --version 26.3 --out "$RUNNER_TEMP/client.jar"

      - name: zlib ve libffi (vcpkg, statik, x64-windows-static)
        shell: pwsh
        run: |
          vcpkg install zlib:x64-windows-static libffi:x64-windows-static
          $root = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows-static"
          $lib = Join-Path $root "lib"
          # vcpkg output names are not pinned here: list what was installed, then pick the release archives
          Get-ChildItem $root -Recurse -Filter "*.lib" | ForEach-Object { Write-Host "vcpkg lib: $($_.FullName)" }
          $dst = Join-Path $env:RUNNER_TEMP "winlibs"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          # the runtime links -lz and -lffi (z.lib, ffi.lib); debug variants are skipped
          $z = Get-ChildItem $root -Recurse -Filter "*.lib" | Where-Object { $_.Name -in @("zlib.lib", "zs.lib", "libzs.lib", "libz.lib") -and $_.FullName -notmatch "debug" } | Select-Object -First 1
          if (-not $z) { throw "zlib static library not found under $root" }
          Copy-Item $z.FullName (Join-Path $dst "z.lib") -Force
          $ffi = Get-ChildItem $root -Recurse -Filter "*ffi*.lib" | Where-Object { $_.FullName -notmatch "debug" } | Select-Object -First 1
          if (-not $ffi) { throw "libffi import library not found under $root" }
          Copy-Item $ffi.FullName (Join-Path $dst "ffi.lib") -Force
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$dst;$lib;$env:LIB"

      - name: Oyunu derle (MSVC, JDK ve kutuphaneler otomatik)
        run: |
          python tools/mcbuild_rust.py "$RUNNER_TEMP/client.jar" -o build/minecraft-26.3 --shards 32 --shard-jobs 1

      - name: OpenGL 3.3 yazilim surucusu (Mesa 26.3.1, pal1000/mesa-dist-win)
        # GitHub Windows koşucusunda donanım sürücüsü yok ve GDI yalnızca OpenGL 1.1 verir; oyun 3.3 core ister.
        # Sürüm etiketle sabit. Varlık, GitHub release API'sindeki sha256 digest değeriyle doğrulanır; eşleşmezse durur.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=26.3.1
          REL=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/pal1000/mesa-dist-win/releases/tags/$TAG)
          ASSET=$(printf '%s' "$REL" | python -c "import json,sys; d=json.load(sys.stdin); a=[x for x in d['assets'] if x['name'].endswith('release-msvc.7z')][0]; print(a['name'], a['browser_download_url'], a['digest'])")
          set -- $ASSET
          NAME=$1; URL=$2; WANT=${3#sha256:}
          curl -sSL --retry 4 -o "$RUNNER_TEMP/$NAME" "$URL"
          GOT=$(sha256sum "$RUNNER_TEMP/$NAME" | cut -d' ' -f1)
          test "$GOT" = "$WANT" || { echo "FAIL: sha256 $GOT != digest $WANT for $NAME"; exit 1; }
          7z x "$RUNNER_TEMP/$NAME" -o"$RUNNER_TEMP/mesa" -y > /dev/null
          OGL=$(find "$RUNNER_TEMP/mesa" -iname opengl32.dll | head -1)
          test -n "$OGL"
          cp "$(dirname "$OGL")"/*.dll build/minecraft-26.3/rust/
          echo "mesa $TAG $NAME sha256 $GOT"

      - name: Oyunu ac ve dogrula (120 sn, ekran goruntusu)
        shell: pwsh
        run: ./tools/ci_game_boot.ps1 -Build build\minecraft-26.3 -Seconds 120

      - name: Ekran goruntusu ve gunluk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-boot-windows
          path: build/minecraft-26.3/boot
          if-no-files-found: warn
          retention-days: 14

