name: ci
on:
  push:
  pull_request:

# Quick gate for every push: syntax, lint, machine-independent sanity, plus ONE differential test.
# Heavy verification (full suite, Client Core E2E, sharded Minecraft build) is intentionally NOT
# in CI — see docs/HARDWARE.md for the machine it needs.

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python syntax and lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyflakes
          python -m py_compile j2zig/*.py tools/*.py tests/*.py .claude/hooks/guard.py
          python -m pyflakes j2zig/*.py tools/*.py tests/*.py .claude/hooks/guard.py

      - name: Zig install and ast-check
        run: |
          python -m pip install ziglang==0.15.1
          ZIG=$(python -c "import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),'zig'))")
          sudo ln -sf "$ZIG" /usr/local/bin/zig
          zig version
          for f in runtime/*.zig patches/*.zig; do echo "== $f"; zig ast-check "$f"; done

      - name: Shell syntax and JSON validity
        run: |
          bash -n build.sh
          python -c "import json; [json.load(open(f)) for f in ['patches/manifest.json']]"

      - name: Guard hook self-test
        run: python .claude/hooks/guard.py --self-test

      - name: JDK 25 install
        run: |
          mkdir -p "$HOME/.cache/j2zig/temurin-25"
          curl -sSL --retry 4 -o /tmp/jdk25.tar.gz "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse"
          tar -xzf /tmp/jdk25.tar.gz -C "$HOME/.cache/j2zig/temurin-25"
          echo "J2Z_JDK_HOME=$(echo "$HOME"/.cache/j2zig/temurin-25/jdk-*)" >> "$GITHUB_ENV"
          ls "$HOME"/.cache/j2zig/temurin-25/jdk-*/bin/javac

      - name: Zig unit tests (Client Core RHI)
        run: zig test -lc runtime/rhi.zig

      - name: Differential test Arith (Debug, native backend)
        run: |
          python tests/run_tests.py --min-avail-gib 0 Arith

      - name: Build TouchCore APK (Android arm64-v8a via NDK/SDK)
        run: |
          python3 tools/build_touchcore_apk.py --out build/TouchCore-For-Minecraft-Zig-Edition.apk
          ZIPALIGN=$(command -v zipalign || ls -d /usr/local/lib/android/sdk/build-tools/*/zipalign | sort -V | tail -n 1)
          "$ZIPALIGN" -c -p 4 build/TouchCore-For-Minecraft-Zig-Edition.apk

      - name: Android NDK 4-shard --no-lwjgl shared library smoke test
        run: |
          mkdir -p build/ci_nolwjgl/classes
          cat > build/ci_nolwjgl/CiNoLwjgl.java <<'EOF'
          import org.lwjgl.stb.STBImage;
          import org.lwjgl.opengl.GL;
          import org.lwjgl.system.MemoryStack;
          public class CiNoLwjgl {
              public static void main(String[] args) {
                  try (MemoryStack st = MemoryStack.stackPush()) {
                      GL.createCapabilities();
                      STBImage.stbi_set_flip_vertically_on_load(true);
                  }
              }
          }
          EOF
          "$J2Z_JDK_HOME/bin/javac" -source 17 -target 17 --add-exports java.base/jdk.internal.misc=ALL-UNNAMED -cp runtime/java_nolwjgl:runtime/java -sourcepath runtime/java_nolwjgl:runtime/java -d build/ci_nolwjgl/classes build/ci_nolwjgl/CiNoLwjgl.java
          "$J2Z_JDK_HOME/bin/jar" cf build/ci_nolwjgl/CiNoLwjgl.jar -C build/ci_nolwjgl/classes CiNoLwjgl.class
          python3 -m j2zig build-lib --cp build/ci_nolwjgl/CiNoLwjgl.jar --main CiNoLwjgl --no-lwjgl --shards 4 -dynamic --target aarch64-linux-android.26 --name libminecraft_j2z.so -o build/ci_nolwjgl/out
          readelf -h build/ci_nolwjgl/out/libminecraft_j2z.so | grep -q "AArch64"
          nm -D build/ci_nolwjgl/out/libminecraft_j2z.so | grep -q "j2z_android_entry"

      - name: Upload TouchCore APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchCore-For-Minecraft-Zig-Edition-apk
          path: build/TouchCore-For-Minecraft-Zig-Edition.apk
          retention-days: 14
