name: ci
on:
  push:
  pull_request:

# Her push için hızlı kapı: sözdizimi, lint, makineden bağımsız doğruluk denetimi ve TEK bir fark testi.
# Ağır doğrulama (tam paket, Client Core E2E, parçalı Minecraft derlemesi) bilerek CI'da DEĞİLDİR;
# gereken makine için docs/HARDWARE.md dosyasına bakın.

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python syntax and lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyflakes
          python -m py_compile monolith/*.py tools/*.py tests/*.py .claude/hooks/guard.py
          python -m pyflakes monolith/*.py tools/*.py tests/*.py .claude/hooks/guard.py

      - name: Rust runtime type-check and clippy (warnings are errors)
        run: |
          python3 tools/rt_typecheck.py
          cd rt_deps && cargo clippy --release --offline --lib --manifest-path check/Cargo.toml --target-dir target -- -D warnings

      - name: Shell syntax and JSON validity
        run: |
          bash -n build.sh
          python -c "import json; [json.load(open(f)) for f in ['patches/rust/manifest.json']]"

      - name: Guard hook self-test
        run: python .claude/hooks/guard.py --self-test

      - name: Runtime audio unit tests (mixer and device layer, no JDK needed)
        run: |
          rustc --edition 2021 --test tests/rust/audio_main.rs -o /tmp/audio_tests
          /tmp/audio_tests

      - name: Runtime crash reporter unit tests (panic and SIGSEGV child processes)
        run: |
          rustc --edition 2021 --test tests/rust/crash_main.rs -o /tmp/crash_tests
          /tmp/crash_tests

      - name: Runtime native-call counter unit tests
        run: |
          rustc --edition 2021 --test tests/rust/ncount_main.rs -o /tmp/ncount_tests
          /tmp/ncount_tests

      - name: Runtime dependencies build offline (rt_deps, vendored)
        run: |
          cd rt_deps
          cargo build --release --offline

      - name: JDK 25 install
        run: |
          mkdir -p "$HOME/.cache/monolith/temurin-25"
          curl -sSL --retry 4 -o /tmp/jdk25.tar.gz "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse"
          tar -xzf /tmp/jdk25.tar.gz -C "$HOME/.cache/monolith/temurin-25"
          echo "MONO_JDK_HOME=$(echo "$HOME"/.cache/monolith/temurin-25/jdk-*)" >> "$GITHUB_ENV"
          ls "$HOME"/.cache/monolith/temurin-25/jdk-*/bin/javac

      - name: Rust codegen stack tests (JDK 25 reference, rustc-compiled output)
        run: |
          python3 monolith/stack_tests.py

      - name: Build TouchCore APK (Android arm64-v8a via NDK/SDK)
        run: |
          rustup target add aarch64-linux-android
          python3 tools/build_touchcore_apk.py --out build/Monolith.apk
          ZIPALIGN=$(command -v zipalign || ls -d /usr/local/lib/android/sdk/build-tools/*/zipalign | sort -V | tail -n 1)
          "$ZIPALIGN" -c -p 4 build/Monolith.apk

      - name: Android NDK 4-shard --no-lwjgl shared library smoke test
        run: |
          mkdir -p build/ci_nolwjgl/classes
          cat > build/ci_nolwjgl/CiNoLwjgl.java <<'EOF'
          import org.lwjgl.stb.STBImage;
          import org.lwjgl.opengl.GL;
          import org.lwjgl.system.MemoryStack;
          public class CiNoLwjgl {
              public static void main(String[] args) {
                  try (MemoryStack st = MemoryStack.stackPush()) {
                      GL.createCapabilities();
                      STBImage.stbi_set_flip_vertically_on_load(true);
                  }
              }
          }
          EOF
          "$MONO_JDK_HOME/bin/javac" -source 17 -target 17 --add-exports java.base/jdk.internal.misc=ALL-UNNAMED -cp runtime/java_nolwjgl:runtime/java -sourcepath runtime/java_nolwjgl:runtime/java -d build/ci_nolwjgl/classes build/ci_nolwjgl/CiNoLwjgl.java
          "$MONO_JDK_HOME/bin/jar" cf build/ci_nolwjgl/CiNoLwjgl.jar -C build/ci_nolwjgl/classes CiNoLwjgl.class
          # `python -m monolith build-lib`, Zig arka ucuyla birlikte kaldırıldı (2 ile çıkar); Rust yolu rustgen --android'dir
          python3 -m monolith.rustgen --cp build/ci_nolwjgl/CiNoLwjgl.jar --main CiNoLwjgl --no-lwjgl --shards 4 --android -o build/ci_nolwjgl/out
          readelf -h build/ci_nolwjgl/out/libminecraft_mono.so | grep -q "AArch64"
          nm -D build/ci_nolwjgl/out/libminecraft_mono.so | grep -q "mono_android_entry"

      - name: Upload TouchCore APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monolith-apk
          path: build/Monolith.apk
          retention-days: 14
